<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1.0">

<title>

Borrow Books

</title>

<link
rel="stylesheet"
href="css/style.css">

<link
href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
rel="stylesheet">

</head>

<body>

<div class="dashboard">

<div class="sidebar">

<h2>

📚 ShelfShare

</h2>

<ul>

<li><a href="dashboard.html">🏠 Dashboard</a></li>

<li><a href="books.html">📖 Books</a></li>

<li><a href="inventory.html">📦 Inventory</a></li>

<li><a href="borrow.html">🔄 Borrow</a></li>

<li><a href="wishlist.html">❤️ Wishlist</a></li>

<li><a href="reservation.html">📅 Reservation</a></li>

<li><a href="scan.html">🤖 AI Scan</a></li>

<li>

<a
href="#"
onclick="performLogout()">

🚪 Logout

</a>

</li>

</ul>

</div>

<div class="main">

<div class="navbar">

<div>

<h1>

Borrow & Return

</h1>

<p>

Manage issued books

</p>

</div>

</div>

<div class="search-container">

<input

type="number"

id="userId"

placeholder="Enter User ID">

<button

onclick="loadBorrowedBooks()">

Load My Books

</button>

</div>

<table>

<thead>

<tr>

<th>ID</th>

<th>Book</th>

<th>Issue Date</th>

<th>Due Date</th>

<th>Status</th>

<th>Fine</th>

<th>Action</th>

</tr>

</thead>

<tbody id="borrowTable">
    </tbody>

</table>

<div class="form-card">

<h2>

Rate Returned Book

</h2>

<div class="form-row">

<div>

<label>

Rental ID

</label>

<input

type="number"

id="ratingRentalId"

placeholder="Rental ID">

</div>

<div>

<label>

Rating (1-5)

</label>

<select id="rating">

<option value="1">1 ⭐</option>

<option value="2">2 ⭐⭐</option>

<option value="3">3 ⭐⭐⭐</option>

<option value="4">4 ⭐⭐⭐⭐</option>

<option value="5">5 ⭐⭐⭐⭐⭐</option>

</select>

</div>

</div>

<button

class="primary-btn"

onclick="submitRating()">

Submit Rating

</button>

</div>

<div
id="loader"
class="loader hidden">

<div class="spinner"></div>

<p>

Loading...

</p>

</div>

<div
id="toast"
class="toast">

</div>

<script src="js/api.js"></script>

<script src="js/auth.js"></script>

<script src="js/borrow.js"></script>

</body>

</html>
