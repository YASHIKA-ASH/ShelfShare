<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>

Books

</title>

<link
rel="stylesheet"
href="css/style.css">

<link
href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
rel="stylesheet">

</head>

<body>

<div class="dashboard">

<!-- Sidebar -->

<div class="sidebar">

<h2>

📚 ShelfShare

</h2>

<ul>

<li>

<a href="dashboard.html">

🏠 Dashboard

</a>

</li>

<li>

<a href="books.html">

📖 Books

</a>

</li>

<li>

<a href="inventory.html">

📦 Inventory

</a>

</li>

<li>

<a href="borrow.html">

🔄 Borrow

</a>

</li>

<li>

<a href="wishlist.html">

❤️ Wishlist

</a>

</li>

<li>

<a href="reservation.html">

📅 Reservations

</a>

</li>

<li>

<a href="scan.html">

🤖 AI Scan

</a>

</li>

<li>

<a href="#"

onclick="performLogout()">

🚪 Logout

</a>

</li>

</ul>

</div>

<!-- Main -->

<div class="main">

<div class="navbar">

<div>

<h1>

Books

</h1>

<p>

Browse and Manage Library Books

</p>

</div>

<button
class="primary-btn"
onclick="window.location='scan.html'">

➕ AI Add Book

</button>

</div>

<!-- Search -->

<div class="search-container">

<input

type="text"

id="searchBox"

placeholder="Search by title, author or subject">

<button

onclick="searchBooks()">

Search

</button>

<button

onclick="loadBooks()">

Refresh

</button>

</div>

<!-- Book Grid -->

<div

class="book-grid"

id="bookGrid">
<!-- Dynamic Books will load here -->

</div>

<!-- Add Copy Modal -->

<div
id="copyModal"
class="hidden">

<div class="form-card">

<h2>

Add Book Copies

</h2>

<input

type="number"

id="copyCount"

placeholder="Number of Copies">

<input

type="text"

id="rack"

placeholder="Rack Number">

<button

class="primary-btn"

onclick="submitCopies()">

Save Copies

</button>

<button

class="primary-btn"

style="margin-top:10px;background:#ef4444;"

onclick="closeModal()">

Cancel

</button>

</div>

</div>

<!-- Loading -->

<div
id="loader"
class="loader hidden">

<div class="spinner"></div>

<p>

Loading Books...

</p>

</div>

<!-- Toast -->

<div
id="toast"
class="toast">

</div>

<script src="js/api.js"></script>

<script src="js/auth.js"></script>

<script src="js/books.js"></script>

</body>

</html>
