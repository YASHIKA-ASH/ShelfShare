<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1.0">

<title>

AI Book Scanner

</title>

<link
rel="stylesheet"
href="css/style.css">

<link
href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
rel="stylesheet">

</head>

<body>

<div class="dashboard">

<div class="sidebar">

<h2>

📚 ShelfShare

</h2>

<ul>

<li><a href="dashboard.html">🏠 Dashboard</a></li>

<li><a href="books.html">📖 Books</a></li>

<li><a href="inventory.html">📦 Inventory</a></li>

<li><a href="borrow.html">🔄 Borrow</a></li>

<li><a href="wishlist.html">❤️ Wishlist</a></li>

<li><a href="reservation.html">📅 Reservation</a></li>

<li><a href="scan.html">🤖 AI Scan</a></li>

<li>

<a href="#"

onclick="performLogout()">

🚪 Logout

</a>

</li>

</ul>

</div>

<div class="main">

<div class="navbar">

<div>

<h1>

AI Book Scanner

</h1>

<p>

Upload Book Cover

</p>

</div>

</div>

<div class="upload-box">

<input

type="file"

id="bookImage"

accept="image/*">

<br><br>

<button

class="primary-btn"

onclick="scanBook()">

Scan Book

</button>

</div>

<div

class="preview"

id="preview">

</div>

<div

class="form-card">

<h2>

Detected Details

</h2>

<div class="form-row">

<input
id="title"
placeholder="Title">

<input
id="author"
placeholder="Author">

</div>

<div class="form-row">

<input
id="publisher"
placeholder="Publisher">

<input
id="edition"
placeholder="Edition">

</div>

<div class="form-row">

<input
id="subject"
placeholder="Subject">

<input
id="isbn"
placeholder="ISBN">

</div>

<textarea

id="description"

placeholder="Description">

</textarea>

<button

class="primary-btn"

onclick="saveBook()">

Save Book

</button>

</div>

<div id="loader"

class="loader hidden">

<div class="spinner"></div>

</div>

<div

id="toast"

class="toast">

</div>

<script src="js/api.js"></script>

<script src="js/auth.js"></script>

<script src="js/scan.js"></script>

</body>

</html>
